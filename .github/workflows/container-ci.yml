name: Container CI

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'server/Dockerfile'
      - 'server/docker-entrypoint.sh'
      - 'server/package*.json'
      - 'server/prisma/**'
      - 'server/src/**'
      - '.github/workflows/container-ci.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'server/Dockerfile'
      - 'server/docker-entrypoint.sh'
      - 'server/package*.json'
      - 'server/prisma/**'
      - 'server/src/**'
      - '.github/workflows/container-ci.yml'

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose API profile
        run: docker compose --profile api config --quiet
      - name: Build API image
        run: docker build --tag cadpilot-api:ci ./server
      - name: Verify required runtime configuration guard
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://cadpilot:cadpilot@postgres:5432/cadpilot \
            -e JWT_ACCESS_SECRET=ci-access-secret-with-at-least-32-characters \
            -e JWT_REFRESH_SECRET=ci-refresh-secret-with-at-least-32-characters \
            cadpilot-api:ci node -e "console.log('entrypoint-ok')"

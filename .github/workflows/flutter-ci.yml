name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tablet_app

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter 3.44.4
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart and Flutter
        run: flutter analyze --no-pub

      - name: Run unit and widget tests
        run: flutter test --no-pub

      - name: Build WebAssembly release
        run: flutter build web --wasm --release --no-pub

      - name: Build release web application
        run: flutter build web --release --no-pub
